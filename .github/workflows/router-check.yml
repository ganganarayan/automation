name: Wake content-engine and run the daily router

# The daily post router (docs/daily-router-plan.md). At 16:00 IST this ping
# wakes the app, which decides TOMORROW's lane for every active funnel and sends
# the approval emails needed; then the app goes back to sleep. Idempotent per
# funnel + post date, so a late or repeated run never lines up a second post.
# GitHub cron is UTC and may start 5-30 minutes late, which is fine here.
#
# Repo secrets (Settings -> Secrets and variables -> Actions), same as post-check.yml:
#   CONTENT_ENGINE_URL  e.g. https://content-engine-production-230f.up.railway.app (no trailing slash)
#   RUN_DUE_KEY         the content-engine ADMIN_KEY (sent as X-Admin-Key)

on:
  schedule:
    - cron: '30 10 * * *'   # 16:00 IST
  workflow_dispatch:
    inputs:
      retry:
        description: "Re-decide days recorded as 'none' (1 = yes)"
        required: false
        default: '0'

jobs:
  router-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping router-check
        env:
          URL: ${{ secrets.CONTENT_ENGINE_URL }}
          KEY: ${{ secrets.RUN_DUE_KEY }}
          RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "CONTENT_ENGINE_URL / RUN_DUE_KEY secrets are not set; skipping."
            exit 0
          fi
          # The first request may hit a cold start (502): try a few times.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/v1/jobs/router-check?retry=$RETRY" -H "X-Admin-Key: $KEY")
            echo "attempt $i: HTTP $code"
            [ "$code" = "202" ] && exit 0
            sleep 20
          done
          exit 1
