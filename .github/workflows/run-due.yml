name: Run the legacy posters by hand

# MANUAL ONLY. There is no schedule here on purpose: the daily router owns all
# three posting lanes now (ready video → AI video → image), and it is woken by
# .github/workflows/wake.yml. Putting a cron back on this workflow would make
# the legacy image poster and the video scheduler create a second post for the
# same funnel and day, so leave it on workflow_dispatch.
#
# Kept as an escape hatch for the two older entry points, each admin-guarded,
# idempotent and 202 + async:
#   /api/v1/jobs/run-due        -> legacy image poster (funnel-posters module)
#   /api/v1/jobs/run-due-video  -> video pipeline (one instance per due funnel
#                                  at script_review)
# The LinkedIn → WhatsApp relay used to be pinged here; it now runs on its own
# times in wake.yml (Setup → Settings → Daily schedule (IST)).
#
# Repo secrets (Settings -> Secrets and variables -> Actions):
#   CONTENT_ENGINE_URL  e.g. https://automation-staging.up.railway.app   (no trailing slash)
#   RUN_DUE_KEY         the content-engine ADMIN_KEY (sent as the X-Admin-Key header)
#
# A generous ?window means the ping can be early/late and still catch every
# funnel due around that time; each funnel is generated once per target post
# date (the endpoints de-dupe).

on:
  workflow_dispatch: {}        # run it from the Actions tab when you need it

jobs:
  run-due:
    runs-on: ubuntu-latest
    steps:
      # Video pipeline: wake + create instances for funnels due now.
      - name: Trigger run-due-video
        run: |
          curl -fsS -X POST \
            "${{ secrets.CONTENT_ENGINE_URL }}/api/v1/jobs/run-due-video?window=15" \
            -H "X-Admin-Key: ${{ secrets.RUN_DUE_KEY }}" \
            -w '\nHTTP %{http_code}\n'

      # Legacy image poster (kept until the video pipeline fully replaces it).
      - name: Trigger run-due (legacy image poster)
        run: |
          curl -fsS -X POST \
            "${{ secrets.CONTENT_ENGINE_URL }}/api/v1/jobs/run-due?window=15" \
            -H "X-Admin-Key: ${{ secrets.RUN_DUE_KEY }}" \
            -w '\nHTTP %{http_code}\n'
