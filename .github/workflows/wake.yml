name: Wake content-engine for its daily jobs

# The app sleeps on Railway. Every 15 minutes this run reads the wake-up times
# from the repository variable WAKE_SCHEDULE (written by the app's
# Setup → Settings → Daily schedule (IST) → Sync wake-up times), e.g.
#   {"router":["16:00"],"nudge":["10:00"],"posts":["08:20","20:20"]}
# and pings each job whose time fell within the last 30 minutes (IST). A time
# therefore fires about 15–30 minutes after it is set, and GitHub's own cron
# delays are absorbed. A job can be pinged by two runs in a row; that is fine:
#   router → /api/v1/jobs/router-check  (router_days de-dupes per funnel + day,
#            and the app runs only the tenants whose time is due)
#   posts  → /api/v1/jobs/check-posts   (one run at a time; each channel's
#            ✅/❌ and the go-live email are recorded once)
#   nudge  → /api/v1/jobs/nudge         (one email a day at most; the app
#            runs only the tenants whose nudge time is due)
# Empty or unreadable variable → the defaults above.
#
# Repo secrets (Settings -> Secrets and variables -> Actions):
#   CONTENT_ENGINE_URL  e.g. https://content-engine-production-230f.up.railway.app (no trailing slash)
#   RUN_DUE_KEY         the content-engine ADMIN_KEY (sent as X-Admin-Key)
# This repo is public: never print the secrets; only the times are logged.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Run one job now regardless of its time (blank = only what is due)'
        required: false
        default: ''
        type: choice
        options: ['', 'router', 'posts', 'nudge']
      retry:
        description: "router only: re-decide days recorded as 'none' (1 = yes)"
        required: false
        default: '0'

concurrency:
  group: wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the due jobs
        env:
          URL: ${{ secrets.CONTENT_ENGINE_URL }}
          KEY: ${{ secrets.RUN_DUE_KEY }}
          SCHED: ${{ vars.WAKE_SCHEDULE }}
          FORCE: ${{ github.event.inputs.job || '' }}
          RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "CONTENT_ENGINE_URL / RUN_DUE_KEY secrets are not set; skipping."
            exit 0
          fi
          if [ "$RETRY" = "1" ]; then RETRY=1; else RETRY=0; fi
          DEFAULT='{"router":["16:00"],"nudge":["10:00"],"posts":["08:20","20:20"]}'
          if [ -z "$SCHED" ] || ! printf '%s' "$SCHED" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "WAKE_SCHEDULE is empty or unreadable; using the defaults."
            SCHED="$DEFAULT"
          fi

          # IST = UTC + 05:30, fixed offset (no runner TZ).
          H=$(date -u +%H); M=$(date -u +%M)
          NOW=$(( (10#$H * 60 + 10#$M + 330) % 1440 ))
          printf 'now %02d:%02d IST\n' $((NOW / 60)) $((NOW % 60))

          # The job's times, keeping only well-formed HH:MM (nothing else is echoed).
          times() { printf '%s' "$SCHED" | jq -r --arg j "$1" '(.[$j] // []) | if type == "array" then .[] else empty end | tostring' | grep -E '^([01][0-9]|2[0-3]):[0-5][0-9]$' || true; }
          due() {
            for t in $(times "$1"); do
              m=$(( 10#${t%%:*} * 60 + 10#${t##*:} ))
              ago=$(( (NOW - m + 1440) % 1440 ))
              if [ "$ago" -lt 30 ]; then echo "$1: $t is due (${ago} min ago)"; return 0; fi
            done
            return 1
          }
          # The first request may hit a cold start (502): try a few times.
          ping() {
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL$1" -H "X-Admin-Key: $KEY")
              echo "  attempt $i: HTTP $code"
              [ "$code" = "202" ] && return 0
              sleep 20
            done
            return 1
          }

          failed=0
          for job in router posts nudge; do
            echo "$job: $(times "$job" | paste -sd, -)"
            if [ -n "$FORCE" ]; then
              [ "$FORCE" = "$job" ] || continue
              echo "$job: run by hand"
            elif ! due "$job"; then
              continue
            fi
            case "$job" in
              router)
                path="/api/v1/jobs/router-check?retry=$RETRY"
                if [ -n "$FORCE" ]; then path="$path&all=1"; fi ;;
              posts) path="/api/v1/jobs/check-posts" ;;
              nudge)
                path="/api/v1/jobs/nudge"
                if [ -n "$FORCE" ]; then path="$path?all=1"; fi ;;
            esac
            ping "$path" || failed=1
          done
          exit $failed
